<!-- header.html -->
<header class="header">
    <div class="header-container">
        <div class="logo-container">
            <!-- Logo SVG -->
            <div class="logo-icon">
                <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" class="tech-logo">
                    <defs>
                        <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#4a00e0" />
                            <stop offset="100%" stop-color="#8e2de2" />
                        </linearGradient>
                        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur stdDeviation="2" result="blur" />
                            <feComposite in="SourceGraphic" in2="blur" operator="over" />
                        </filter>
                    </defs>
                    
                    <!-- Base circular shape -->
                    <circle cx="32" cy="32" r="30" fill="rgba(22, 22, 45, 0.7)" stroke="url(#logoGradient)" stroke-width="2" />
                    
                    <!-- Tech elements -->
                    <g filter="url(#glow)"></g>
                        <!-- Code brackets -->
                        <path d="M20,20 L14,32 L20,44" fill="none" stroke="#00b4d8" stroke-width="2.5" stroke-linecap="round" />
                        <path d="M44,20 L50,32 L44,44" fill="none" stroke="#00b4d8" stroke-width="2.5" stroke-linecap="round" />
                        
                        <!-- Central element - circuit-like paths -->
                        <circle cx="32" cy="32" r="6" fill="url(#logoGradient)" />
                        
                        <!-- Circuit lines -->
                        <path d="M32,26 L32,16" stroke="url(#logoGradient)" stroke-width="2" />
                        <path d="M32,38 L32,48" stroke="url(#logoGradient)" stroke-width="2" />
                        <path d="M26,32 L16,32" stroke="url(#logoGradient)" stroke-width="2" />
                        <path d="M38,32 L48,32" stroke="url(#logoGradient)" stroke-width="2" />
                        
                        <!-- Corner nodes -->
                        <circle cx="16" cy="16" r="2" fill="#00b4d8" />
                        <circle cx="48" cy="16" r="2" fill="#00b4d8" />
                        <circle cx="16" cy="48" r="2" fill="#00b4d8" />
                        <circle cx="48" cy="48" r="2" fill="#00b4d8" />
                        
                        <!-- Connection lines -->
                        <path d="M17.5,17.5 L26,26" stroke="#00b4d8" stroke-width="1.5" />
                        <path d="M46.5,17.5 L38,26" stroke="#00b4d8" stroke-width="1.5" />
                        <path d="M17.5,46.5 L26,38" stroke="#00b4d8" stroke-width="1.5" />
                        <path d="M46.5,46.5 L38,38" stroke="#00b4d8" stroke-width="1.5" />
                    </g>
                </svg>
            </div>
            <h1 class="brand-name"><span class="lt">LT</span> <span class="dev">&lt; Dev /&gt;</span></h1>
        </div>
        <nav class="nav">
            <ul class="nav-list">
                <li class="nav-item"><a href="../docs/#hero" class="nav-link">Inicio</a></li>
                <li class="nav-item"><a href="../docs/#titulaciones" class="nav-link">Titulaciones</a></li>
                <li class="nav-item"><a href="../docs/#proyectos" class="nav-link">Proyectos</a></li>
                <li class="nav-item"><a href="../docs/#contacto" class="nav-link">Contacto</a></li>
            </ul>
            <div class="hamburger-menu" id="hamburger-menu">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
            <div class="dropdown-menu" id="dropdown-menu">
                <ul>
                    <li><a href="../docs/#hero">Inicio</a></li>
                    <li><a href="../docs/#titulaciones">Titulaciones</a></li>
                    <li><a href="../docs/#proyectos">Proyectos</a></li>
                    <li><a href="../docs/#contacto">Contacto</a></li>
                </ul>
            </div>
        </nav>
    </div>
</header>
