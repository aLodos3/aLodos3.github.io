<!-- header.html -->
<header class="header" style="width: 100%; margin: 0; padding: 0;">
    <div class="header-container" style="display: flex; align-items: center; justify-content: space-between;">
        <div class="logo-container" style="display: flex; align-items: center;">
            <!-- Logo SVG -->
            <div class="logo-icon">
                <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" class="tech-logo">
                    <defs>
                        <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#4a00e0" />
                            <stop offset="100%" stop-color="#8e2de2" />
                        </linearGradient>
                        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur stdDeviation="2" result="blur" />
                            <feComposite in="SourceGraphic" in2="blur" operator="over" />
                        </filter>
                    </defs>
                    
                    <!-- Base circular shape -->
                    <circle cx="32" cy="32" r="30" fill="rgba(22, 22, 45, 0.7)" stroke="url(#logoGradient)" stroke-width="2" />
                    
                    <!-- Tech elements -->
                    <g filter="url(#glow)"></g>
                        <!-- Code brackets -->
                        <path d="M20,20 L14,32 L20,44" fill="none" stroke="#00b4d8" stroke-width="2.5" stroke-linecap="round" />
                        <path d="M44,20 L50,32 L44,44" fill="none" stroke="#00b4d8" stroke-width="2.5" stroke-linecap="round" />
                        
                        <!-- Central element - circuit-like paths -->
                        <circle cx="32" cy="32" r="6" fill="url(#logoGradient)" />
                        
                        <!-- Circuit lines -->
                        <path d="M32,26 L32,16" stroke="url(#logoGradient)" stroke-width="2" />
                        <path d="M32,38 L32,48" stroke="url(#logoGradient)" stroke-width="2" />
                        <path d="M26,32 L16,32" stroke="url(#logoGradient)" stroke-width="2" />
                        <path d="M38,32 L48,32" stroke="url(#logoGradient)" stroke-width="2" />
                        
                        <!-- Corner nodes -->
                        <circle cx="16" cy="16" r="2" fill="#00b4d8" />
                        <circle cx="48" cy="16" r="2" fill="#00b4d8" />
                        <circle cx="16" cy="48" r="2" fill="#00b4d8" />
                        <circle cx="48" cy="48" r="2" fill="#00b4d8" />
                        
                        <!-- Connection lines -->
                        <path d="M17.5,17.5 L26,26" stroke="#00b4d8" stroke-width="1.5" />
                        <path d="M46.5,17.5 L38,26" stroke="#00b4d8" stroke-width="1.5" />
                        <path d="M17.5,46.5 L26,38" stroke="#00b4d8" stroke-width="1.5" />
                        <path d="M46.5,46.5 L38,38" stroke="#00b4d8" stroke-width="1.5" />
                    </g>
                </svg>
            </div>
            <h1 class="brand-name" style="font-size: 1.2rem; margin-left: 10px;">
                <span class="dev" style="color: #00b4d8;">&lt;<span class="lt" style="color: white;">LT</span> Dev/&gt;</span>
            </h1>
        </div>
        <nav class="nav" style="display: flex; align-items: center; position: relative;">
            <ul class="nav-list" style="display: flex; margin-right: 20px;">
                <li class="nav-item"><a href="#hero" class="nav-link">Inicio</a></li>
                <li class="nav-item"><a href="#titulaciones" class="nav-link">Titulaciones</a></li>
                <li class="nav-item"><a href="#proyectos" class="nav-link">Proyectos</a></li>
                <li class="nav-item"><a href="#contacto" class="nav-link">Contacto</a></li>
            </ul>
            <div class="hamburger-menu" id="hamburger-menu" style="align-self: center; cursor: pointer;">
                <div class="bar" style="width: 25px; height: 3px; background-color: white; margin: 4px 0; transition: all 0.3s;"></div>
                <div class="bar" style="width: 25px; height: 3px; background-color: white; margin: 4px 0; transition: all 0.3s;"></div>
                <div class="bar" style="width: 25px; height: 3px; background-color: white; margin: 4px 0; transition: all 0.3s;"></div>
            </div>
            <div class="dropdown-menu" id="dropdown-menu" style="display: none; position: absolute; top: 100%; right: 0; background-color: #222; width: 100%; text-align: center; z-index: 1000; transition: all 0.5s ease-in-out;">
                <ul style="list-style: none; padding: 0; margin: 0;">
                    <li><a href="#hero" style="color: white; text-decoration: none; display: block; padding: 10px;">Inicio</a></li>
                    <li><a href="#titulaciones" style="color: white; text-decoration: none; display: block; padding: 10px;">Titulaciones</a></li>
                    <li><a href="#proyectos" style="color: white; text-decoration: none; display: block; padding: 10px;">Proyectos</a></li>
                    <li><a href="#contacto" style="color: white; text-decoration: none; display: block; padding: 10px;">Contacto</a></li>
                </ul>
            </div>
        </nav>
    </div>
</header>
<script>
    const hamburgerMenu = document.getElementById('hamburger-menu');
    const dropdownMenu = document.getElementById('dropdown-menu');
    let menuOpen = false;

    hamburgerMenu.addEventListener('click', () => {
        menuOpen = !menuOpen;
        dropdownMenu.style.display = menuOpen ? 'block' : 'none';
        hamburgerMenu.querySelectorAll('.bar')[0].style.transform = menuOpen ? 'rotate(45deg) translate(5px, 5px)' : 'rotate(0)';
        hamburgerMenu.querySelectorAll('.bar')[1].style.opacity = menuOpen ? '0' : '1';
        hamburgerMenu.querySelectorAll('.bar')[2].style.transform = menuOpen ? 'rotate(-45deg) translate(5px, -5px)' : 'rotate(0)';
    });
</script>
<footer class="footer" style="width: 100%; background-color: #222; color: white; text-align: center; padding: 10px 0; margin: 0; position: relative;">
    <!-- Footer content -->
</footer>
