<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio de LT Dev</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Estilos globales -->
    <link rel="stylesheet" href="loader/loader.css">
    <link rel="stylesheet" href="styles/main.css">
    <!-- Estilos de componentes -->
    <link rel="stylesheet" href="header/header.css">
    <link rel="stylesheet" href="hero/hero.css">
    <link rel="stylesheet" href="titulaciones/titulaciones.css">
    <link rel="stylesheet" href="proyectos/proyectos.css">
    <link rel="stylesheet" href="contacto/contacto.css">
    <link rel="stylesheet" href="footer/footer.css">
    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- AOS - Animate On Scroll Library -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
</head>
<body>
    <!-- Loader -->
    <div id="loader" class="d-flex flex-column align-items-center justify-content-center">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-3">Cargando...</p>
    </div>

    <!-- Fondo animado -->
    <canvas id="background-canvas" class="w-100"></canvas>

    <!-- Header -->
    <header id="header-container" class="container-fluid">
        <!-- Contenido de header.html -->
    </header>

    <!-- Hero Section -->
    <section id="hero" class="hero container">
        <!-- Contenido de hero.html -->
    </section>

    <!-- Titulaciones Section -->
    <section id="titulaciones" class="titulaciones container">
        <!-- Contenido de titulaciones.html -->
    </section>

    <!-- Proyectos Section -->
    <section id="proyectos" class="proyectos container">
        <!-- Contenido de proyectos.html -->
    </section>

    <!-- Contacto Section -->
    <section id="contacto" class="contacto container">
        <!-- Contenido de contacto.html -->
    </section>

    <!-- Footer -->
    <footer id="footer-container" class="container-fluid">
        <!-- Contenido de footer.html -->
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Scripts globales -->
    <script src="loader/loader.js"></script>
    <script src="background/background.js"></script>
    <!-- Scripts de componentes -->
    <script src="header/header.js"></script>
    <script src="hero/hero.js"></script>
    <script src="titulaciones/titulaciones.js"></script>
    <script src="proyectos/proyectos.js"></script>
    <script src="contacto/contacto.js"></script>
    <script src="footer/footer.js"></script>

    <!-- Script para cargar el header dinámicamente -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetch('header/header.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('header-container').innerHTML = data;
                    const script = document.createElement('script');
                    script.src = 'header/header.js';
                    script.defer = true;
                    document.body.appendChild(script);
                })
                .catch(error => console.error('Error loading the header:', error));
        });

        document.addEventListener('DOMContentLoaded', () => {
            fetch('footer/footer.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('footer-container').innerHTML = data;
                    const script = document.createElement('script');
                    script.src = 'footer/footer.js';
                    script.defer = true;
                    document.body.appendChild(script);
                })
                .catch(error => console.error('Error loading the footer:', error));
        });
    </script>
</body>
</html>
