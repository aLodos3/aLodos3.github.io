<!-- Loader HTML structure -->
<div id="loader" class="loader" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #000; display: flex; align-items: center; justify-content: center; z-index: 9999;">
    <div class="loader-animation">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" class="tech-loader">
            <circle cx="50" cy="50" r="45" stroke="#00b4d8" stroke-width="4" fill="none" stroke-dasharray="283" stroke-dashoffset="0">
                <animate attributeName="stroke-dashoffset" values="283;0" dur="1.5s" repeatCount="indefinite" />
            </circle>
            <circle cx="50" cy="50" r="35" stroke="#8e2de2" stroke-width="4" fill="none" stroke-dasharray="220" stroke-dashoffset="0">
                <animate attributeName="stroke-dashoffset" values="220;0" dur="1.5s" repeatCount="indefinite" />
            </circle>
        </svg>
    </div>
</div>
