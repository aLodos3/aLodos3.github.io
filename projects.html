<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proyectos</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='logoGradient' x1='0%' y1='0%' x2='100%' y2='0%'><stop offset='0%' stop-color='%234a00e0'/><stop offset='100%' stop-color='%238e2de2'/></linearGradient><filter id='glow' x='-20%' y='-20%' width='140%' height='140%'><feGaussianBlur stdDeviation='2' result='blur'/><feComposite in='SourceGraphic' in2='blur' operator='over'/></filter></defs><circle cx='32' cy='32' r='30' fill='rgba(22, 22, 45, 0.7)' stroke='url(%23logoGradient)' stroke-width='2'/><g filter='url(%23glow)'><path d='M20,20 L14,32 L20,44' fill='none' stroke='%2300b4d8' stroke-width='2.5' stroke-linecap='round'/><path d='M44,20 L50,32 L44,44' fill='none' stroke='%2300b4d8' stroke-width='2.5' stroke-linecap='round'/><circle cx='32' cy='32' r='6' fill='url(%23logoGradient)'/><path d='M32,26 L32,16' stroke='url(%23logoGradient)' stroke-width='2'/><path d='M32,38 L32,48' stroke='url(%23logoGradient)' stroke-width='2'/><path d='M26,32 L16,32' stroke='url(%23logoGradient)' stroke-width='2'/><path d='M38,32 L48,32' stroke='url(%23logoGradient)' stroke-width='2'/><circle cx='16' cy='16' r='2' fill='%2300b4d8'/><circle cx='48' cy='16' r='2' fill='%2300b4d8'/><circle cx='16' cy='48' r='2' fill='%2300b4d8'/><circle cx='48' cy='48' r='2' fill='%2300b4d8'/><path d='M17.5,17.5 L26,26' stroke='%2300b4d8' stroke-width='1.5'/><path d='M46.5,17.5 L38,26' stroke='%2300b4d8' stroke-width='1.5'/><path d='M17.5,46.5 L26,38' stroke='%2300b4d8' stroke-width='1.5'/><path d='M46.5,46.5 L38,38' stroke='%2300b4d8' stroke-width='1.5'/></g></svg>" type="image/svg+xml">
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/projects.css" />
  <link rel="stylesheet" href="css/loader.css" />
  <link rel="stylesheet" href="css/header.css" />
  <link rel="stylesheet" href="css/footer.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
</head>
<body>
  <div id="loader">
    <div class="spinner"></div>
    <p>Cargando...</p>
  </div>

  <canvas id="background-canvas"></canvas>

  <header id="header" class="sticky-top">
    <div class="container header-container">
        <div class="logo">
            <a href="index.html" aria-label="Inicio - DevPortfolio">
                <div class="logo-icon">
                    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" class="tech-logo">
                        <defs>
                            <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" stop-color="#4a00e0" />
                                <stop offset="100%" stop-color="#8e2de2" />
                            </linearGradient>
                            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                                <feGaussianBlur stdDeviation="2" result="blur" />
                                <feComposite in="SourceGraphic" in2="blur" operator="over" />
                            </filter>
                        </defs>
                        <circle cx="32" cy="32" r="30" fill="rgba(22, 22, 45, 0.7)" stroke="url(#logoGradient)" stroke-width="2" />
                        <g filter="url(#glow)">
                            <path d="M20,20 L14,32 L20,44" fill="none" stroke="#00b4d8" stroke-width="2.5" stroke-linecap="round" />
                            <path d="M44,20 L50,32 L44,44" fill="none" stroke="#00b4d8" stroke-width="2.5" stroke-linecap="round" />
                            <circle cx="32" cy="32" r="6" fill="url(#logoGradient)" />
                            <path d="M32,26 L32,16" stroke="url(#logoGradient)" stroke-width="2" />
                            <path d="M32,38 L32,48" stroke="url(#logoGradient)" stroke-width="2" />
                            <path d="M26,32 L16,32" stroke="url(#logoGradient)" stroke-width="2" />
                            <path d="M38,32 L48,32" stroke="url(#logoGradient)" stroke-width="2" />
                            <circle cx="16" cy="16" r="2" fill="#00b4d8" />
                            <circle cx="48" cy="16" r="2" fill="#00b4d8" />
                            <circle cx="16" cy="48" r="2" fill="#00b4d8" />
                            <circle cx="48" cy="48" r="2" fill="#00b4d8" />
                            <path d="M17.5,17.5 L26,26" stroke="#00b4d8" stroke-width="1.5" />
                            <path d="M46.5,17.5 L38,26" stroke="#00b4d8" stroke-width="1.5" />
                            <path d="M17.5,46.5 L26,38" stroke="#00b4d8" stroke-width="1.5" />
                            <path d="M46.5,46.5 L38,38" stroke="#00b4d8" stroke-width="1.5" />
                        </g>
                    </svg>
                </div>
                <h1><span class="code-tag">&lt;</span>ALT <span class="highlight">Dev</span><span class="code-tag">/&gt;</span></h1>
            </a>
        </div>
        <a href="index.html" class="btn btn-tech" aria-label="Volver al Inicio">
            <i class="fas fa-rocket"></i> Inicio
        </a>
    </div>
  </header>
  <main class="projects-section">
    <div class="container projects-container">
      <div class="projects-cards">
        <div class="project-card">
          <img src="img/certificado.jpg" alt="Proyecto 1" class="project-image" />
          <div class="project-description">
            <h3>Proyecto 1</h3>
            <p>Descripción breve del proyecto 1.</p>
            <button class="btn btn-primary view-project" data-project="1">Ver Proyecto</button>
          </div>
        </div>
        <div class="project-card">
          <img src="img/certificado.jpg" alt="Proyecto 2" class="project-image" />
          <div class="project-description">
            <h3>Proyecto 2</h3>
            <p>Descripción breve del proyecto 2.</p>
            <button class="btn btn-primary view-project" data-project="2">Ver Proyecto</button>
          </div>
        </div>
        <div class="project-card">
          <img src="img/certificado.jpg" alt="Proyecto 3" class="project-image" />
          <div class="project-description">
            <h3>Proyecto 3</h3>
            <p>Descripción breve del proyecto 3.</p>
            <button class="btn btn-primary view-project" data-project="3">Ver Proyecto</button>
          </div>
        </div>
        <div class="project-card">
          <img src="img/certificado.jpg" alt="Proyecto 4" class="project-image" />
          <div class="project-description">
            <h3>Proyecto 4</h3>
            <p>Descripción breve del proyecto 4.</p>
            <button class="btn btn-primary view-project" data-project="4">Ver Proyecto</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal para ver proyecto completo -->
    <div id="project-modal" class="modal hidden">
      <div class="modal-content">
        <button class="close-modal" style="position: absolute; top: 10px; right: 10px; background: none; color: red; border: none; font-size: 1.5rem; cursor: pointer;">&times;</button>
        <span class="close-modal">&times;</span>
        <div id="project-modal-content">
          <!-- Contenido dinámico del proyecto -->
        </div>
      </div>
    </div>
  </main>
  <footer class="footer" style="text-align: center;">
    <div class="container">
      <p>&copy; <span id="year"></span> Mi Portfolio. Todos los derechos reservados.</p>
    </div>
    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </footer>
  <script src="js/projects.js"></script>
  <script src="js/background.js"></script>
  <script src="js/loader.js"></script>
</body>
</html>
