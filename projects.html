<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proyectos</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/projects.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <script defer src="js/modal.js"></script>
</head>
<body>
  <header>
    <h1>Todos los Proyectos</h1>
  </header>
  <main class="projects-section">
    <div class="container projects-container">
      <div class="projects-cards">
        <div class="project-card">
          <img src="img/certificado.jpg" alt="Proyecto 1" class="project-image" />
          <div class="project-description">
            <h3>Proyecto 1</h3>
            <p>Descripción breve del proyecto 1.</p>
            <button class="btn btn-primary view-project" data-project="1">Ver Proyecto</button>
          </div>
        </div>
        <div class="project-card">
          <img src="img/certificado.jpg" alt="Proyecto 2" class="project-image" />
          <div class="project-description">
            <h3>Proyecto 2</h3>
            <p>Descripción breve del proyecto 2.</p>
            <button class="btn btn-primary view-project" data-project="2">Ver Proyecto</button>
          </div>
        </div>
        <div class="project-card">
          <img src="img/certificado.jpg" alt="Proyecto 3" class="project-image" />
          <div class="project-description">
            <h3>Proyecto 3</h3>
            <p>Descripción breve del proyecto 3.</p>
            <button class="btn btn-primary view-project" data-project="3">Ver Proyecto</button>
          </div>
        </div>
        <div class="project-card">
          <img src="img/certificado.jpg" alt="Proyecto 4" class="project-image" />
          <div class="project-description">
            <h3>Proyecto 4</h3>
            <p>Descripción breve del proyecto 4.</p>
            <button class="btn btn-primary view-project" data-project="4">Ver Proyecto</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal para ver proyecto completo -->
    <div id="project-modal" class="modal hidden">
      <div class="modal-content">
        <span class="close-modal">&times;</span>
        <div id="project-modal-content">
          <!-- Contenido dinámico del proyecto -->
        </div>
      </div>
    </div>
  </main>
  <footer class="footer">
    <div class="container">
      <p>&copy; <span id="year"></span> Mi Portfolio. Todos los derechos reservados.</p>
    </div>
    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </footer>
  <script src="js/projects.js"></script>
</body>
</html>
